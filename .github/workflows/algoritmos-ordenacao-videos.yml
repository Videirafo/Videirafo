name: Videos completos dos algoritmos

on:
  push:
    branches:
      - main
    paths:
      - 'projetos/algoritmos_ordenacao_completo/animacoes/*.svg'
      - 'projetos/algoritmos_ordenacao_completo/ferramentas/gerar_videos.py'
      - '.github/workflows/algoritmos-ordenacao-videos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar renderizador e ffmpeg
        run: |
          python -m pip install --disable-pip-version-check 'cairosvg==2.8.2'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Renderizar nove videos
        run: python projetos/algoritmos_ordenacao_completo/ferramentas/gerar_videos.py
      - name: Salvar arquivos MP4 no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projetos/algoritmos_ordenacao_completo/videos/
          if ! git diff --cached --quiet; then
            git commit -m "docs(academico): gera videos MP4 dos nove algoritmos"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
