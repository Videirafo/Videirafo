name: Profile Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required profile content
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          grep -q "Fernando Videira" README.md
          grep -q "SaaS Engineering Playbook" README.md
          grep -q "Engineering Portfolio" README.md

      - name: Check common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='profile-quality.yml' '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY)' .; then
            echo "Potential secret detected."
            exit 1
          fi
          echo "No common secret patterns detected."
